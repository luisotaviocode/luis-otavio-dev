<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="shortcut icon" href="design/images/logotipo-luis-otavio.svg" type="image/x-icon">
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <!-- CSS Links -->
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/reset.css">
    <!-- Título da Página -->
    <title>Luis Otávio | Portfólio</title>
</head>
<body>
    <!-- Header -->
    <header id="header-portfolio">
        <a href="index.html">
            <img src="design/images/logotipo-luis-otavio.svg" alt="Logotipo Luis Otávio" id="logotipo-header">
        </a>
    </header>
    <!-- Hero -->
    <section id="hero" class="hero-portfolio">
        <div class="info-view">
            <div id="image-container">
                <img src="design/images/image-profile-377x377.jpg" alt="Foto de perfil do Luis Otávio" id="hero-profile-image">
                <div class="quadrado-fundo-imagem"></div>
            </div>
            <h1>LUIS OTÁVIO</h1>
            <h2>
                Desenvolvedor
                <span id="destaque">Full-Stack</span>
            </h2>
        </div>
        <div class="links-hero-content">
            <a href="https://web.whatsapp.com/send?phone=5577999139278" id="whatsapp" class="midia-links-btns" target="_blank" rel="noopener noreferrer">
                <img src="design/images/icones/redes-sociais/whatsapp.svg" alt="Ícone do Whatsapp" class="midias-icones">
            </a>
            <a href="https://www.linkedin.com/in/luis-otavio-barreto-dantas" id="linkedin" class="midia-links-btns" target="_blank" rel="noopener noreferrer">
                <img src="design/images/icones/redes-sociais/linkedin.svg" alt="Ícone do LinkedIn" class="midias-icones">
            </a>
            <a href="https://www.github.com/luisotaviocode" id="github" class="midia-links-btns" target="_blank" rel="noopener noreferrer">
                <img src="design/images/icones/redes-sociais/github.svg" alt="Ícone do Github" class="midias-icones">
            </a>
            <a href="mailto:luisotaviocode@gmail.com" id="email" class="midia-links-btns">
                <img src="design/images/icones/redes-sociais/mail.svg" alt="Ícone de E-Mail" class="midias-icones">
            </a>
        </div>
    </section>
    <div id="scroll-screen-paragraph">
        <p id="scroll-screen-paragraph-text">Scroll Down</p>
        <img src="design/images/icones/circle-arrow-down.svg" alt="Ícone de scroll down" id="scroll-down-icon">
    </div>
</body>
</html>
